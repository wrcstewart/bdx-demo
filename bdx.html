<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDX — controller</title>
<!--
  BDX — the controller half of the demo.

  A script panel, the steppers, and the drawing. It holds the SCRIPT, which is
  the thing that is true: the only form that can be shared, saved or collaged.
  Everything else — the steppers, the drawing here, the viewer on another
  device — is a view of it.

  It needs NO database, no corpus, no graph, no accounts. Two files and a relay.

  THE STEPPERS ARE NOT MINE. The renderer carries its own control panel; a host
  that wants to supply its own hides it with bd_ui_config. Not hiding it is how
  this page gets steppers for free, and is the cheapest way to build a
  controller for any module that follows the convention.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #0a0a0f; color: #c9c9d4;
    font: 13px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-bottom: 1px solid #23232e; flex: 0 0 auto;
  }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; color: #e8e8f0; }
  header .sub { color: #6a6a78; font-size: 11px; }
  /* CANARY host for BDX. Every commit to a file a browser caches paints this
     border the next colour in red -> green -> blue, so "am I looking at the
     current version" is answerable at a glance rather than by clearing a
     cache. It matters more here than in a server-rendered app: these pages
     live on GitHub Pages, behind a CDN that caches happily.
     2026-09-20: RED (a copy button on the script panel). Next = green. */
  #view {
    margin-left: auto; background: #000; color: #fff; border: 2px solid #c0392b;
    border-radius: 3px; padding: 6px 14px; font: 600 12px system-ui, sans-serif;
    cursor: pointer;
  }
  #view:hover { background: #2e1414; }
  #state { font-size: 11px; color: #7a7a86; }
  /* Shown only when there is no relay yet. A query string is too easy to lose
     on a reload, and losing it produced a page that looked healthy and did
     nothing — so the relay can simply be typed, and is remembered. */
  #rxurl, #rxset { display: none; }
  body.norelay #rxurl {
    display: inline-block; width: 260px; padding: 5px 7px;
    background: #101018; color: #cfcfda; border: 1px solid #2a2a3a;
    border-radius: 3px; font: 12px system-ui, sans-serif;
  }
  body.norelay #rxset {
    display: inline-block; background: #000; color: #fff;
    border: 1px solid #c9a227; border-radius: 3px; padding: 5px 10px;
    font: 12px system-ui, sans-serif; cursor: pointer;
  }
  #state.problem { color: #d98a8a; }
  /* The remedy for mixed content is a different URL, not a different relay —
     so offer the URL. A box cannot help: anything typed into it is still an
     http relay being reached from an https page. */
  #gohttp {
    font: 11px system-ui, sans-serif; color: #0a0a0f; background: #c9a227;
    padding: 4px 9px; border-radius: 3px; text-decoration: none; font-weight: 600;
  }
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  #frame { flex: 1 1 auto; border: 0; min-width: 0; background: #0a0a0f; }
  aside {
    flex: 0 0 300px; display: flex; flex-direction: column;
    border-left: 1px solid #23232e; min-width: 0;
  }
  aside label {
    padding: 6px 10px 4px; font-size: 11px; color: #6a6a78;
    display: flex; align-items: center; gap: 8px;
  }
  aside label input { width: 15px; height: 15px; accent-color: #c9a227; margin: 0; }
  #copy {
    margin-left: auto; background: #000; color: #c9c9d4;
    border: 1px solid #3a3a4a; border-radius: 3px; padding: 3px 9px;
    font: 11px system-ui, sans-serif; cursor: pointer;
  }
  #copy:hover { border-color: #c9a227; color: #fff; }
  #script {
    flex: 1 1 auto; margin: 0 10px 10px; padding: 8px; resize: none;
    background: #101018; color: #cfcfda; border: 1px solid #2a2a3a; border-radius: 3px;
    /* 16px or iOS zooms the page when it takes focus. */
    font: 16px/1.45 'Courier New', monospace;
  }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    aside { flex: 0 0 42%; border-left: 0; border-top: 1px solid #23232e; }
  }
</style>
</head>
<body>
  <header>
    <h1>BDX</h1>
    <span class="sub">controller &mdash; the script is the truth</span>
    <span id="state">connecting&hellip;</span>
  <a id="gohttp" href="#" style="display:none">open the http page instead</a>
    <input id="rxurl" type="text" spellcheck="false" placeholder="relay URL, e.g. http://localhost:8081"
         title="Where the relay is. Remembered, so a reload does not lose it.">
  <button id="rxset" type="button" title="Use this relay">use</button>
  <button id="view" type="button" title="Open a viewer and drive it from here">View</button>
  </header>
  <main>
    <!-- No src at load. The renderer announces BD_READY as soon as it loads, and
         if the iframe starts before the listener below is attached that
         announcement is lost for ever, leaving a page that looks connected and
         never draws. Set from JS, after the listener. -->
    <iframe id="frame" title="renderer"></iframe>
    <aside>
      <label><input type="checkbox" id="auto" checked> auto &mdash; keep the script and the steppers in step
        <button id="copy" type="button" title="Copy the script to the clipboard">copy</button>
      </label>
      <textarea id="script" spellcheck="false"></textarea>
    </aside>
  </main>

<script>
'use strict';

// ── Where the relay is ──────────────────────────────────────────────────────
//
// ?rx=<origin> overrides, which is what lets this PUBLISHED page be pointed at
// your own relay without forking anything. Default below; localhost when this
// page is itself served from localhost, so a developer needs no query string.
// No relay is deployed yet, so the published copy has nowhere to point. When
// one exists this becomes its origin and the hosted pages work on click.
const DEFAULT_RX = 'https://rx.example.invalid';
const RX_UNSET   = DEFAULT_RX.indexOf('.invalid') !== -1;
const params  = new URLSearchParams(location.search);
const LOCAL   = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

// Where the relay is, in order of preference: the query string, then whatever
// was last typed into the box below, then localhost if that is where this page
// is, then the compiled-in default.
//
// The stored one matters more than it looks. ?rx= is lost by any reload that
// does not carry it, and the result was a page that drew perfectly, said
// nothing, and had never created a socket — three rounds of debugging.
let STORED_RX = null;
try { STORED_RX = localStorage.getItem('bdx_rx'); } catch (_) {}
const RX = params.get('rx') || STORED_RX ||
           (LOCAL ? location.protocol + '//' + location.hostname + ':8081' : DEFAULT_RX);
if (params.get('rx')) { try { localStorage.setItem('bdx_rx', params.get('rx')); } catch (_) {} }

const MODULE_ID = 'kolam';          // which KIND of viewer a token is for
const frame  = document.getElementById('frame');
const script = document.getElementById('script');
const auto   = document.getElementById('auto');
const stateEl = document.getElementById('state');

function say(t, problem) {
  stateEl.textContent = t;
  stateEl.classList.toggle('problem', !!problem);
  stateEl.title = 'relay: ' + RX;
}

// ── Say what went wrong, wherever it went wrong ─────────────────────────────
//
// A page whose script dies halfway looks exactly like a page that is waiting,
// and both look exactly like a page that is working — the drawing comes from
// an iframe and carries on regardless. So: surface anything thrown, rather
// than leaving the header saying "connecting…" for ever.
window.addEventListener('error', (e) => {
  say('script error: ' + ((e && e.message) || 'unknown'), true);
});
window.addEventListener('unhandledrejection', (e) => {
  say('failed: ' + ((e && e.reason && (e.reason.message || e.reason)) || 'unknown'), true);
});

// Opened by double-clicking the file rather than through a server. The drawing
// will work, because the renderer is a relative path — and NOTHING else will,
// because a file:// page has no origin a socket can be opened from. Worth
// saying plainly: it is the one failure that looks like success.
if (location.protocol === 'file:') {
  say('opened as a file — serve it over http to reach a relay', true);
}

const DEFAULT_SCRIPT = [
  '%%bd_module kolam',
  '%%bd_symmetry 8',
  '%%bd_depth 2',
  '%%bd_step 50',
  '%%bd_angle 90',
  '%%bd_angle_minutes 0',
  '%%bd_angle_drift 10',
  '%%bd_colour_speed 4',
  '%%bd_stroke angle',
  '%%bd_saturation 100',
  '%%bd_lightness 65',
  '%%bd_background #0a0a0f',
  '%%bd_weight 1.5',
  '%%bd_score [',
  'axiom: F+F+F+F+F+F+F+F',
  'F: F+F-F-F+F+F+F-F',
  '%%bd_]',
  ''
].join('\n');

// ── The renderer ────────────────────────────────────────────────────────────
let moduleReady = false, pending = null;
window.addEventListener('message', (e) => {
  const d = e && e.data;
  if (!d) return;
  if (d.type === 'BD_READY') {
    moduleReady = true;
    post(pending || (script.value = DEFAULT_SCRIPT));
    pending = null;
    return;
  }
  // The renderer announces its live script on EVERY render — the only way a
  // host learns that a stepper moved. fromDrift marks the ones the drift timer
  // caused rather than a person.
  if (d.type === 'bd_av_state' && typeof d.text === 'string') onRender(d.text, !!d.fromDrift);
});
function post(text) {
  if (!moduleReady) { pending = text; return; }
  try { frame.contentWindow.postMessage({ type: 'bd_script_update', script: text }, '*'); } catch (_) {}
}
frame.src = 'renderer.html';

// ── Script ↔ steppers, and the push to a viewer ─────────────────────────────
//
// The rule BD arrived at the hard way, and the reason this is not simply
// "push every frame":
//
// A drift tick changes only the angle, and the viewer runs the SAME renderer
// from the SAME script, so it is already advancing the angle itself. Sending
// ours can only overwrite its smooth value with our older one — invisible
// side by side, and on a phone, where the controller is a background tab and
// is throttled, it snaps the viewer backwards every few seconds.
//
// So: THE SCRIPT RECORDS THE ANGLE, THE VIEWER COMPUTES IT. Everything else
// goes straight through.
const ANGLE_LINES = /^%%bd_angle(?:_minutes|_seconds)?[ \t]+.*$/gm;
const withoutAngle = (t) => t.replace(ANGLE_LINES, '');
let lastPushed = null;

function pushToViewer(text) {
  if (!socket || !socket.connected || !text) return;
  if (text === lastPushed) return;
  lastPushed = text;
  socket.emit('msg', { type: 'av_push', moduleId: MODULE_ID, payload: { script: text } });
}

// Written no more than once a second while drifting, or the panel would be
// unreadable and unselectable at five to ten writes a second.
let lastWrite = 0, pendingText = null, pendingTimer = null;
function onRender(text, fromDrift) {
  if (!auto.checked) return;
  if (fromDrift && lastPushed && withoutAngle(text) === withoutAngle(lastPushed)) {
    // The angle alone. Record it in the panel, do not send it.
    if (Date.now() - lastWrite >= 1000) writePanel(text);
    else {
      pendingText = text;
      if (!pendingTimer) pendingTimer = setTimeout(() => {
        pendingTimer = null;
        const t = pendingText; pendingText = null;
        if (t && auto.checked) writePanel(t);
      }, 1000 - (Date.now() - lastWrite));
    }
    return;
  }
  writePanel(text);
  pushToViewer(text);
}
// Milliseconds of quiet after a real keystroke before the module may write the
// panel again. Longer than the 600ms edit debounce, so an edit reaches the
// renderer before anything writes over it.
const TYPING_QUIET_MS = 1200;
let lastTypedAt = 0;

function writePanel(text) {
  lastWrite = Date.now();
  // Do not fight the keyboard — but the question is "is someone TYPING", not
  // "is the caret in this box".
  //
  // 2026-09-19: this was `document.activeElement === script`, and it stopped
  // the panel updating from the steppers for good. Two things combine. The
  // caret STAYS in the panel after you stop typing; and the renderer's stepper
  // buttons call preventDefault on pointerdown, so clicking one does not move
  // focus to the iframe either. Once you had edited the script, the guard
  // never lifted again.
  //
  // This is the same fault ButterflyDreaming had on 09-18 and the same fix,
  // arrived at a second time because the lesson was carried over incompletely:
  // BD's panel is a contentEditable div, where rewriting destroys the caret,
  // so BD had to separate recording from redrawing. THIS panel is a textarea,
  // where the caret can simply be put back — so the simpler answer is right
  // here and would have been wrong there.
  if (Date.now() - lastTypedAt < TYPING_QUIET_MS) return;
  if (script.value === text) return;
  const focused = document.activeElement === script;
  let a = null, b = null;
  if (focused) { try { a = script.selectionStart; b = script.selectionEnd; } catch (_) {} }
  script.value = text;
  if (focused && a != null) {
    const cap = script.value.length;
    try { script.setSelectionRange(Math.min(a, cap), Math.min(b, cap)); } catch (_) {}
  }
}

// A hand edit drives the renderer AND the viewer. Debounced, and held back
// while a directive has no value: the renderer fills a missing value from its
// own default, so sending a half-typed line makes the figure jump to the
// default instead of holding still.
let editTimer = null;
script.addEventListener('input', (e) => {
  if (!e.isTrusted) return;                 // our own writes dispatch input too
  lastTypedAt = Date.now();
  clearTimeout(editTimer);
  editTimer = setTimeout(() => {
    const text = script.value;
    if (!/^%%bd_\w+/m.test(text)) return;
    const bare = /^%%bd_(center|hint|chunk)[ \t]*$/;
    if (text.split('\n').some(l => /^%%bd_\w+[ \t]*$/.test(l) && !bare.test(l))) return;
    if (auto.checked) post(text);
    pushToViewer(text);
  }, 600);
});
script.addEventListener('blur', () => { if (auto.checked && lastSeen) writePanel(lastSeen); });
let lastSeen = null;
window.addEventListener('message', (e) => {
  const d = e && e.data;
  if (d && d.type === 'bd_av_state' && typeof d.text === 'string') lastSeen = d.text;
});
// Re-ticking means "they are one thing again", and the SCRIPT is the one that
// is true — so the steppers follow it, not the other way round.
auto.addEventListener('change', () => {
  if (auto.checked && /^%%bd_\w+/m.test(script.value)) { post(script.value); pushToViewer(script.value); }
});

// ── Copy the script ─────────────────────────────────────────────────────────
//
// The script is the whole point of this page: it is what can be shared, saved
// or pasted into something else, so getting it OUT has to be one press.
//
// Two rungs, because the modern API is not always there. navigator.clipboard
// needs a SECURE CONTEXT — https, or localhost, which counts. Serve these
// pages over plain http on a LAN address and it is simply undefined, which is
// exactly the arrangement someone testing across devices will reach for.
//
// The fallback is unusually easy here: the text is already sitting in a
// textarea, so it can be selected in place and copied, with no hidden element
// to create and tidy away.
(function () {
  const btn = document.getElementById('copy');
  if (!btn) return;
  const flash = (word) => {
    btn.textContent = word;
    setTimeout(() => { btn.textContent = 'copy'; }, 1500);
  };
  btn.addEventListener('click', async () => {
    const text = script.value;
    if (!text) { flash('empty'); return; }
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        flash('copied');
        return;
      }
    } catch (_) { /* fall through — a refusal is not a reason to give up */ }
    try {
      const at = document.activeElement;
      script.focus();
      script.setSelectionRange(0, script.value.length);
      const ok = document.execCommand('copy');
      script.setSelectionRange(0, 0);
      if (at && at.focus) { try { at.focus(); } catch (_) {} }
      flash(ok ? 'copied' : 'press ⌘C');
    } catch (_) {
      // Both rungs gone. Say what to do rather than pretending it worked —
      // the text is visible and selectable, which is the honest fallback.
      flash('select it');
    }
  });
})();

// ── The relay ───────────────────────────────────────────────────────────────
let socket = null, viewerWindow = null;

if (location.protocol === 'file:') {
  // already said so above
} else if (RX === DEFAULT_RX && RX_UNSET) {
  // The hosted copy, with no relay deployed behind it. Naming a placeholder
  // host reads like a broken link; offer the box instead. The drawing and the
  // steppers still work — everything except reaching a viewer does.
  offerBox();
  say('no relay set — type one and press use', true);
} else {
  say('relay ' + RX.replace(/^https?:\/\//, '') + ' — connecting…');
  // Logged, because the failure this keeps producing is SILENT: the drawing
  // works, the header looks busy, and nothing says whether the client was
  // even asked for. Four lines in the console beat an hour of inference.
  console.log('[bdx] page origin ' + location.origin + ', relay ' + RX);
  console.log('[bdx] requesting ' + RX + '/socket.io/socket.io.js');
  const s = document.createElement('script');
  s.src = RX + '/socket.io/socket.io.js';
  s.onload  = () => { console.log('[bdx] client loaded, connecting'); connect(); };
  s.onerror = (err) => {
    console.warn('[bdx] client did NOT load from ' + RX, err);
    offerBox();
    // An HTTPS page reaching an http:// relay is MIXED CONTENT. Chrome and
    // Firefox make an exception for localhost and allow it; Safari does not,
    // and blocks the script outright — which looks exactly like the relay
    // being down. Name it, because the fix is completely different: use the
    // page the relay itself serves, or give the relay a certificate.
    if (location.protocol === 'https:' && RX.startsWith('http://')) {
      // MIXED CONTENT, and the box is no use for it — anything typed in is
      // still an http relay reached from an https page, so pressing "use"
      // reloads into the same wall. Chrome and Firefox make an exception for
      // localhost; Safari does not. The only remedies are a different PAGE
      // URL or a relay with a certificate, so offer the first as a link.
      document.body.classList.remove('norelay');
      const a = document.getElementById('gohttp');
      if (a) { a.href = RX + '/bdx.html'; a.style.display = 'inline-block'; }
      say('Safari blocks this https page from reaching an http relay —', true);
    } else {
      say('no relay at ' + RX, true);
    }
  };
  document.head.appendChild(s);
}

function connect() {
  if (typeof io !== 'function') {
    console.warn('[bdx] socket.io loaded but io() is not defined');
    say('relay client loaded but unusable', true);
    return;
  }
  socket = io(RX);
  socket.on('connect',       () => { console.log('[bdx] connected, id ' + socket.id); say('relay: connected'); });
  socket.on('connect_error', (e) => {
    console.warn('[bdx] connect_error', e && e.message);
    offerBox();
    say('relay refused: ' + (e && e.message), true);
  });
  socket.on('disconnect',    (r) => say('relay lost: ' + r, true));
  socket.on('msg', (m) => {
    if (!m) return;
    // A viewer has just connected and is asking what to show. It knows when it
    // is ready and nobody else does, so answering beats guessing with a timer.
    if (m.type === 'av_request_state') {
      const text = lastSeen || script.value;
      lastPushed = null;                    // a resync is never a duplicate
      pushToViewer(text);
      return;
    }
    // The viewer's way-back button. It carries what the viewer was showing —
    // on a phone it closes itself a moment later, so this is the only chance.
    if (m.type === 'av_return') {
      if (typeof m.script === 'string' && m.script) { script.value = m.script; post(m.script); }
      try { window.focus(); } catch (_) {}
      say('viewer handed back');
      return;
    }
  });
}

// The box. Remembered, then reload — simpler and more obviously correct than
// re-running the connection machinery in place.
//
// Shown whenever reaching a relay FAILS, not only when none is configured.
// Offering it only in the second case was a gap: a page that cannot reach the
// relay it was given is exactly when you want to type a different one, and
// there was no way to.
function offerBox() { document.body.classList.add('norelay'); }

(function () {
  const box = document.getElementById('rxurl');
  const go  = document.getElementById('rxset');
  if (!box || !go) return;
  box.value = STORED_RX || RX ||
              (LOCAL ? location.protocol + '//' + location.hostname + ':8081'
                     : 'http://localhost:8081');
  const use = () => {
    const v = box.value.trim().replace(/\/$/, '');
    if (!/^https?:\/\//.test(v)) { say('a relay URL starts http:// or https://', true); return; }
    try { localStorage.setItem('bdx_rx', v); } catch (_) {}
    location.href = location.pathname + '?rx=' + encodeURIComponent(v);
  };
  go.addEventListener('click', use);
  box.addEventListener('keydown', (e) => { if (e.key === 'Enter') use(); });
})();

// ── Re-issuing a token to a viewer whose own is spent ───────────────────────
//
// A token is single-use, so a viewer that drops for longer than the relay's
// recovery window can never reconnect: every retry re-runs the handshake
// against a token that no longer exists. The viewer asks us for another — only
// a controller can mint one, so this is a request, not the viewer helping
// itself.
//
// Narrowed twice: only a window WE opened, and the answer is aimed at that
// window's own origin. A page that merely guessed the message shape gets
// nothing.
window.addEventListener('message', (e) => {
  const d = e && e.data;
  if (!d || d.type !== 'bd_av_token_request') return;
  if (!viewerWindow || e.source !== viewerWindow) return;
  if (!socket || !socket.connected) return;
  let done = false;
  const onToken = (m) => {
    if (!m || m.type !== 'module_token' || done) return;
    done = true;
    socket.off('msg', onToken);
    if (!m.token) return;
    try { e.source.postMessage({ type: 'bd_av_token', token: m.token }, e.origin); } catch (_) {}
    say('re-issued a token to the viewer');
  };
  socket.on('msg', onToken);
  socket.emit('msg', { type: 'mint_module_token', moduleId: MODULE_ID });
  setTimeout(() => { if (!done) { done = true; socket.off('msg', onToken); } }, 4000);
});

// ── View ────────────────────────────────────────────────────────────────────
//
// The click IS the user gesture. NOTHING may await before window.open, or
// Safari refuses it — so the window is claimed first and navigated once the
// token arrives. A WINDOW, not a tab: a tab covers the controls, and the point
// of a viewer is to watch it while working them.
document.getElementById('view').addEventListener('click', () => {
  if (viewerWindow && !viewerWindow.closed) {
    try { viewerWindow.focus(); } catch (_) {}
    lastPushed = null;
    pushToViewer(lastSeen || script.value);
    return;
  }
  if (!socket || !socket.connected) {
    say(!socket ? 'no relay client — see the console' : 'relay not connected yet', true);
    console.warn('[bdx] View pressed with socket=' + (socket ? 'present, not connected' : 'never created'));
    return;
  }

  const vw = Math.max(520, Math.round(screen.availWidth * 0.5));
  const vh = Math.max(460, Math.round(screen.availHeight * 0.86));
  const w = window.open('about:blank', '_blank',
    'popup=yes,width=' + vw + ',height=' + vh + ',left=' + Math.max(0, screen.availWidth - vw) +
    ',top=0,menubar=no,toolbar=no,location=no,resizable=yes');
  if (!w) { say('popup blocked — allow popups to open a viewer', true); return; }

  let done = false;
  const onToken = (m) => {
    if (!m || m.type !== 'module_token' || done) return;
    done = true;
    socket.off('msg', onToken);
    if (!m.token) { say('relay would not mint a token', true); try { w.close(); } catch (_) {} return; }
    viewerWindow = w;
    w.location.replace('avx.html?t=' + encodeURIComponent(m.token) +
                       '&rx=' + encodeURIComponent(RX) +
                       '&from=' + encodeURIComponent(location.origin));
    say('viewer opened');
  };
  socket.on('msg', onToken);
  socket.emit('msg', { type: 'mint_module_token', moduleId: MODULE_ID });
  setTimeout(() => { if (!done) { done = true; socket.off('msg', onToken); say('no token', true); } }, 4000);
});
</script>
</body>
</html>
